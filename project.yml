name: NestlyIOS
options:
  bundleIdPrefix: Baby
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 3TN6G8DQVM
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  NestlyCore:
    path: NestlyCore
targets:
  NestlyIOS:
    type: application
    platform: iOS
    sources:
      - path: NestlyIOS
      - path: Shared
    dependencies:
      - package: NestlyCore
      - target: NestlyWidgets
    entitlements:
      path: NestlyIOS/NestlyIOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.Baby.NestlyIOS
        keychain-access-groups:
          - $(AppIdentifierPrefix)Baby.NestlyIOS.shared
    info:
      path: NestlyIOS/Info.plist
      properties:
        CFBundleDisplayName: Nestly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - Baby.NestlyIOS.reschedule
        CFBundleURLTypes:
          - CFBundleURLName: Baby.NestlyIOS
            CFBundleURLSchemes:
              - nestly
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: Baby.NestlyIOS.addFeed
            UIApplicationShortcutItemTitle: Add feed
            UIApplicationShortcutItemIconSymbolName: drop.fill
        NSCameraUsageDescription: Nestly uses the camera to attach a photo to an entry.
        NSPhotoLibraryUsageDescription: Nestly attaches photos you pick to entries.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Baby.NestlyIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  NestlyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NestlyWidgets
      - path: Shared
    dependencies:
      - package: NestlyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: NestlyWidgets/NestlyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.Baby.NestlyIOS
        keychain-access-groups:
          - $(AppIdentifierPrefix)Baby.NestlyIOS.shared
    info:
      path: NestlyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nestly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Baby.NestlyIOS.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
schemes:
  NestlyIOS:
    build:
      targets:
        NestlyIOS: all
        NestlyWidgets: all
    run:
      config: Debug
    archive:
      config: Release
